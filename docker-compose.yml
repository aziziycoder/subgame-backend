version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: subgame_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-subgame_db}
      POSTGRES_USER: ${DB_USER:-subgame_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SubGamePostgresPass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-subgame_user} -d ${DB_NAME:-subgame_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: subgame_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_admin &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ENGINE=django.db.backends.postgresql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    container_name: subgame_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/subgame.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
